# Description : 构建并验证唯一发布包, 并行运行独立 GitHub 与 Gitee 发布 Action.

name: Build pbi-utils

on:
  push:
    tags: ['desktop-v*']
  pull_request:
    branches: [main, v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      archive_name: ${{ steps.metadata.outputs.archive_name }}
    defaults:
      run:
        shell: pwsh
    env:
      CI: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version, tag and source branch
        id: metadata
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./scripts/ReleaseAutomation.psm1 -Force
          $context = Get-PbiReleaseContext -RepositoryRoot $PWD -Ref $env:GITHUB_REF
          if ($context.ReleaseTag) {
            git merge-base --is-ancestor HEAD "refs/remotes/origin/$($context.SourceBranch)"
            if ($LASTEXITCODE -ne 0) { throw '发布提交不属于指定来源分支' }
            $null = Get-PbiReleaseNotes -RepositoryRoot $PWD -Tag $context.ReleaseTag
          }
          "release_tag=$($context.ReleaseTag)" >> $env:GITHUB_OUTPUT
          "prerelease=$($context.Prerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "archive_name=$($context.ArchiveName)" >> $env:GITHUB_OUTPUT
          $null = New-Item -ItemType Directory -Path ./artifacts/evidence -Force
          $context | ConvertTo-Json | Set-Content ./artifacts/evidence/ci-context.json -Encoding utf8
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: web/package.json
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: web/package.json
          run_install: false
      - name: Prepare licensed NSIS compiler
        run: |
          $ErrorActionPreference = 'Stop'
          $catalog = Get-Content ./licenses/catalog.json -Raw | ConvertFrom-Json
          $nsis = @($catalog.resources | Where-Object name -CEQ 'NSIS-COPYING')
          if ($nsis.Count -ne 1 -or $nsis[0].version -cne '3.13') { throw 'NSIS 版本需重新审核归档及许可' }
          $zip = Join-Path $env:RUNNER_TEMP 'nsis-3.13.zip'
          # SourceForge 对 PowerShell 默认 User-Agent 返回 HTML 下载页; 无 UA 的客户端取得同一官方 ZIP.
          $client = [Net.Http.HttpClient]::new()
          $client.Timeout = [TimeSpan]::FromMinutes(2)
          $response = $null
          try {
            $response = $client.GetAsync($nsis[0].source).GetAwaiter().GetResult()
            $null = $response.EnsureSuccessStatusCode()
            if ($response.RequestMessage.RequestUri.Scheme -cne 'https') { throw 'NSIS 下载没有保持 HTTPS' }
            $bytes = $response.Content.ReadAsByteArrayAsync().GetAwaiter().GetResult()
            Write-Host "NSIS response: status=$([int]$response.StatusCode), content-type=$($response.Content.Headers.ContentType), bytes=$($bytes.Length)"
            [IO.File]::WriteAllBytes($zip, $bytes)
          } finally {
            if ($response) { $response.Dispose() }
            $client.Dispose()
          }
          $downloadHash = (Get-FileHash $zip -Algorithm SHA256).Hash
          $header = [IO.File]::ReadAllBytes($zip)
          $signature = [Convert]::ToHexString($header[0..([Math]::Min(3, $header.Length - 1))])
          Write-Host "NSIS archive: bytes=$($header.Length), signature=$signature, sha256=$downloadHash"
          if ($downloadHash -cne 'BA63DFFC4410EE89193E1CB5A41989991BD77C61068DA17E3156D136B7B0B3D8') { throw 'NSIS 官方归档 SHA256 不符' }
          $tools = Join-Path $env:RUNNER_TEMP 'pbi-utils-build-tools'
          Expand-Archive -LiteralPath $zip -DestinationPath $tools
          $root = Join-Path $tools 'nsis-3.13'
          if ((Get-FileHash (Join-Path $root 'COPYING')).Hash -cne $nsis[0].files[0].sha256) { throw 'NSIS 许可与已审核来源不符' }
          $actual = & (Join-Path $root 'makensis.exe') /VERSION
          if ($LASTEXITCODE -ne 0 -or $actual.Trim() -cne 'v3.13') { throw 'NSIS 编译器版本不符' }
          $root >> $env:GITHUB_PATH
      - name: Restore locked dependencies
        run: pwsh -NoProfile -File ./run.ps1 -Choice setupAll -Scope All -NonInteractive
      - name: Check, test, build and package
        run: |
          pwsh -NoProfile -File ./run.ps1 -Choice release -DotNetMode without-dotnet -NonInteractive 2>&1 | Tee-Object -FilePath ./artifacts/evidence/release-gate.log
          exit $LASTEXITCODE
      - name: Verify framework-dependent CLI and MCP
        run: pwsh -NoProfile -File ./scripts/tests/published-smoke.ps1 -Configuration Release -DotNetMode without-dotnet
      - name: Create and verify installer ZIP
        run: |
          Import-Module ./scripts/ReleaseAutomation.psm1 -Force
          New-PbiReleaseArchive -RepositoryRoot $PWD -Destination ./artifacts/release-zip
      - name: Prepare shared release notes and integrity manifest
        if: steps.metadata.outputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
          ARCHIVE_NAME: ${{ steps.metadata.outputs.archive_name }}
        run: pwsh -NoProfile -File ./.github/scripts/release-bundle.ps1 -Mode Create -Directory ./artifacts/release-zip
      - name: Upload exact release ZIP
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pbi-utils-windows-${{ github.run_id }}
          path: artifacts/release-zip/*
          if-no-files-found: error
          compression-level: 0
      - name: Interactive desktop acceptance
        run: Write-Output 'UNRUN - CI 自动测试不等于交互 Windows UI 验收. 按 .docs/acceptance.md 在交互会话补验.'
      - name: Upload available build evidence
        uses: actions/upload-artifact@v7.0.2
        if: always() && hashFiles('artifacts/evidence/**', 'artifacts/test-results/**') != ''
        with:
          name: evidence-windows
          path: |
            artifacts/test-results
            artifacts/evidence
            artifacts/build/release/win-x64/without-dotnet/manifest.json
          if-no-files-found: error

  push-github:
    name: push-github
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.build.outputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: github-release-${{ needs.build.outputs.release_tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
      ARCHIVE_NAME: ${{ needs.build.outputs.archive_name }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download shared verified release bundle
        shell: bash
        run: gh run download "$GITHUB_RUN_ID" --name "pbi-utils-windows-$GITHUB_RUN_ID" --dir release-zip --repo "$GITHUB_REPOSITORY"
      - name: Verify shared release bundle
        shell: pwsh
        run: ./.github/scripts/release-bundle.ps1 -Mode Verify -Directory ./release-zip
      - uses: ./.github/actions/push-github

  push-gitee:
    name: push-gitee
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.build.outputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: gitee-release-${{ needs.build.outputs.release_tag }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
      ARCHIVE_NAME: ${{ needs.build.outputs.archive_name }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download shared verified release bundle
        shell: bash
        run: gh run download "$GITHUB_RUN_ID" --name "pbi-utils-windows-$GITHUB_RUN_ID" --dir release-zip --repo "$GITHUB_REPOSITORY"
      - name: Verify shared release bundle
        shell: pwsh
        run: ./.github/scripts/release-bundle.ps1 -Mode Verify -Directory ./release-zip
      - uses: ./.github/actions/push-gitee
        with:
          token: ${{ secrets.GITEE_TOKEN }}
          ssh-key: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
